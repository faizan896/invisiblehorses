<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" fill="none">
<style>
path{stroke:#191919;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:no-preference){.body{animation:stride .65s ease-in-out 4}.front{transform-origin:80px 46px;animation:leg .65s ease-in-out 4 alternate}.back{transform-origin:39px 49px;animation:leg .65s ease-in-out 4 alternate-reverse}.tail{transform-origin:30px 37px;animation:tail .65s ease-in-out 4 alternate}@keyframes stride{50%{transform:translateY(-3px)}}@keyframes leg{to{transform:rotate(-16deg)}}@keyframes tail{to{transform:rotate(12deg)}}}
</style>
